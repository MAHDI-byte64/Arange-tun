# staticcheck settings: the default set, less one check.
#
# ST1018 objects to Unicode format characters inside a string literal, on the
# reasonable grounds that an invisible character is usually an accident. In the
# Persian translations — internal/telegram/lang.go and the panel's dictionary —
# it is not. They are written with U+200C ZERO WIDTH NON-JOINER, which is
# ordinary Persian orthography: it is what keeps a word like "به‌روزرسانی" from
# running together into the wrong one. Rewriting those as ‌ escapes would
# satisfy the check by making every translated sentence unreadable to the person
# maintaining it, so the check is turned off instead.
checks = ["inherit", "-ST1018"]
